<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeTunnel Wizard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0f14;
      color: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: #111820;
      border: 1px solid #26313d;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #8f9baa;
      margin-bottom: 28px;
    }

    .steps {
      display: flex;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 8px;
    }

    .step {
      flex: 1;
      text-align: center;
      padding: 9px 5px;
      border-radius: 8px;
      background: #19222c;
      color: #7e8a97;
      font-size: 12px;
    }

    .step.active {
      background: #2563eb;
      color: white;
    }

    .step.done {
      background: #166534;
      color: white;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #c8d0d9;
    }

    .token-wrapper {
      position: relative;
      width: 100%;
    }

    .token-wrapper input {
      width: 100%;
      padding: 14px 52px 14px 14px;
      border-radius: 10px;
      border: 1px solid #303b47;
      background: #0b1117;
      color: white;
      outline: none;
      font-size: 14px;
    }

    .token-wrapper input:focus {
      border-color: #2563eb;
    }

    .token-eye {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      padding: 0;
      margin: 0;
      background: transparent;
      border: 0;
      color: #8f9baa;
      font-size: 19px;
      cursor: pointer;
      border-radius: 8px;
    }

    .token-eye:hover {
      background: #19222c;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .primary:hover {
      background: #1d4ed8;
    }

    .cloudflare {
      background: #f59e0b;
      color: #111;
    }

    .cloudflare:hover {
      background: #fbbf24;
    }

    .choice {
      background: #151e27;
      border: 1px solid #303b47;
      color: white;
      text-align: left;
      padding: 18px;
      margin-top: 12px;
    }

    .choice:hover {
      border-color: #2563eb;
    }

    .choice strong {
      display: block;
      margin-bottom: 5px;
    }

    .choice span {
      color: #8f9baa;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #17202a;
      color: #aeb8c3;
      font-size: 13px;
      word-break: break-word;
    }

    .error {
      background: #3a1717;
      color: #ff9c9c;
    }

    .success {
      background: #12351f;
      color: #9bf0b5;
    }

    .terminal {
      background: #070b0f;
      border: 1px solid #26313d;
      border-radius: 10px;
      padding: 15px;
      min-height: 150px;
      max-height: 280px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      color: #a8f0bb;
      white-space: pre-wrap;
    }

    .result {
      text-align: center;
    }

    .result h2 {
      color: #70e08c;
    }

    .url {
      background: #080d12;
      border: 1px solid #303b47;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>EdgeTunnel Wizard</h1>

    <div class="subtitle">
      Deploy the latest EdgeTunnel automatically
    </div>

    <div class="steps">
      <div id="step1Indicator" class="step active">1. Token</div>
      <div id="step2Indicator" class="step">2. Platform</div>
      <div id="step3Indicator" class="step">3. Installing</div>
      <div id="step4Indicator" class="step">4. Complete</div>
    </div>


    <!-- STEP 1 -->
    <section id="step1">

      <label for="token">Cloudflare API Token</label>

      <div class="token-wrapper">

        <input
          id="token"
          type="password"
          placeholder="Paste your Cloudflare API Token"
          autocomplete="off"
        >

        <button
          type="button"
          class="token-eye"
          id="tokenEye"
          onclick="toggleTokenVisibility()"
          aria-label="Show token">
          👁
        </button>

      </div>

      <button
        class="cloudflare"
        onclick="createCloudflareToken()">
        Create Cloudflare API Token
      </button>

      <button
        class="primary"
        onclick="verifyToken()">
        Continue
      </button>

      <div id="message1" class="message hidden"></div>

    </section>


    <!-- STEP 2 -->
    <section id="step2" class="hidden">

      <label>Where do you want to install EdgeTunnel?</label>

      <button
        class="choice"
        onclick="startDeploy('workers')">

        <strong>Cloudflare Workers</strong>

        <span>
          Deploy EdgeTunnel directly to Workers
        </span>

      </button>

      <button
        class="choice"
        onclick="startDeploy('pages')">

        <strong>Cloudflare Pages</strong>

        <span>
          Deploy EdgeTunnel as a Pages project
        </span>

      </button>

      <div id="message2" class="message hidden"></div>

    </section>


    <!-- STEP 3 -->
    <section id="step3" class="hidden">

      <label>Installation</label>

      <div id="terminal" class="terminal"></div>

    </section>


    <!-- STEP 4 -->
    <section id="step4" class="hidden">

      <div class="result">

        <h2>✓ Installation Complete</h2>

        <p>
          EdgeTunnel has been deployed successfully.
        </p>

        <div id="resultUrl" class="url"></div>

        <button
          class="primary"
          onclick="copyResult()">
          Copy URL
        </button>

      </div>

    </section>

  </div>
</div>


<script>

  /*
   * EdgeTunnel Wizard Backend
   */
  const API_BASE =
    "https://divine-poetry-b97a.hoskhal.workers.dev";


  /*
   * Cloudflare API Token Template
   *
   * Workers Scripts: Edit
   * Workers KV Storage: Edit
   * Pages: Edit
   */
  const CLOUDFLARE_TOKEN_URL =
    "https://dash.cloudflare.com/profile/api-tokens" +
    "?permissionGroupKeys=" +
    encodeURIComponent(
      JSON.stringify([
        {
          key: "workers_scripts",
          type: "edit"
        },
        {
          key: "workers_kv_storage",
          type: "edit"
        },
        {
          key: "page",
          type: "edit"
        }
      ])
    ) +
    "&accountId=*" +
    "&zoneId=all" +
    "&name=" +
    encodeURIComponent("EdgeTunnel Wizard");


  let currentToken = "";
  let currentPlatform = "";
  let resultURL = "";


  /*
   * Show / Hide Token
   */
  function toggleTokenVisibility() {

    const input =
      document.getElementById("token");

    const eye =
      document.getElementById("tokenEye");

    if (input.type === "password") {

      input.type = "text";

      eye.textContent = "🙈";

      eye.setAttribute(
        "aria-label",
        "Hide token"
      );

    } else {

      input.type = "password";

      eye.textContent = "👁";

      eye.setAttribute(
        "aria-label",
        "Show token"
      );

    }
  }


  /*
   * Open Cloudflare Token Creator
   */
  function createCloudflareToken() {

    window.open(
      CLOUDFLARE_TOKEN_URL,
      "_blank"
    );

  }


  /*
   * API Request
   */
  async function post(path, data) {

    const response =
      await fetch(
        API_BASE + path,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(data)
        }
      );

    let result;

    try {

      result = await response.json();

    } catch {

      throw new Error(
        "Invalid response from EdgeTunnel Wizard API."
      );

    }

    if (
      !response.ok ||
      result.success === false
    ) {

      throw new Error(
        result.error ||
        result.message ||
        "Request failed."
      );

    }

    return result;
  }


  /*
   * Message
   */
  function showMessage(
    id,
    text,
    error = false
  ) {

    const element =
      document.getElementById(id);

    element.textContent = text;

    element.classList.remove(
      "hidden",
      "error",
      "success"
    );

    element.classList.add(
      error ? "error" : "success"
    );

  }


  /*
   * Steps
   */
  function showStep(number) {

    for (
      let i = 1;
      i <= 4;
      i++
    ) {

      const section =
        document.getElementById(
          "step" + i
        );

      const indicator =
        document.getElementById(
          "step" +
          i +
          "Indicator"
        );

      section.classList.toggle(
        "hidden",
        i !== number
      );

      indicator.classList.remove(
        "active",
        "done"
      );

      if (i < number) {

        indicator.classList.add(
          "done"
        );

      } else if (i === number) {

        indicator.classList.add(
          "active"
        );

      }

    }

  }


  /*
   * Verify Token
   */
  async function verifyToken() {

    const token =
      document
        .getElementById("token")
        .value
        .trim();

    if (!token) {

      showMessage(
        "message1",
        "Please enter your Cloudflare API Token.",
        true
      );

      return;
    }

    currentToken = token;

    const button =
      document.querySelector(
        "#step1 .primary"
      );

    button.disabled = true;
    button.textContent = "Checking...";

    try {

      const result =
        await post(
          "/api/verify",
          {
            token: currentToken
          }
        );

      if (result.success) {

        showStep(2);

      } else {

        throw new Error(
          result.error ||
          "Token verification failed."
        );

      }

    } catch (error) {

      showMessage(
        "message1",
        error.message,
        true
      );

    } finally {

      button.disabled = false;
      button.textContent = "Continue";

    }

  }


  /*
   * Start Deployment
   */
  async function startDeploy(platform) {

    currentPlatform = platform;

    showStep(3);

    const terminal =
      document.getElementById(
        "terminal"
      );

    terminal.textContent =
      "$ Starting EdgeTunnel installation...\n";

    try {

      addLog(
        "Connecting to Cloudflare..."
      );

      addLog(
        "Downloading latest EdgeTunnel..."
      );

      addLog(
        "Creating Cloudflare resources..."
      );

      const result =
        await post(
          "/api/deploy",
          {
            token: currentToken,
            platform: currentPlatform
          }
        );

      addLog(
        "Deploying EdgeTunnel..."
      );

      if (result.url) {

        resultURL = result.url;

      } else if (result.domain) {

        resultURL = result.domain;

      } else {

        resultURL =
          "Deployment completed successfully.";

      }

      addLog(
        "Installation completed successfully."
      );

      setTimeout(
        () => {

          document.getElementById(
            "resultUrl"
          ).textContent = resultURL;

          showStep(4);

        },
        700
      );

    } catch (error) {

      addLog(
        "ERROR: " +
        error.message
      );

    }

  }


  /*
   * Terminal
   */
  function addLog(text) {

    const terminal =
      document.getElementById(
        "terminal"
      );

    terminal.textContent +=
      "\n> " + text;

    terminal.scrollTop =
      terminal.scrollHeight;

  }


  /*
   * Copy Result
   */
  async function copyResult() {

    if (!resultURL) {
      return;
    }

    try {

      await navigator.clipboard.writeText(
        resultURL
      );

      alert("Copied!");

    } catch {

      alert(
        "Copy failed. Please copy it manually."
      );

    }

  }

</script>

</body>
</html>
